<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>COINMARKETCAT — options</title>
<link rel="stylesheet" href="popup.css">
<style>
  html,body{width:auto;max-width:760px;margin:0 auto;padding:0 16px 40px}
  h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:30px;margin:22px 0 4px}
  h1 em{font-style:italic;color:var(--sol-soft)}
  .lead{color:var(--ink-soft);margin:0 0 14px}
  fieldset{border:1px solid var(--card-line);border-radius:10px;background:var(--card);padding:12px 14px;margin:12px 0}
  legend{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;padding:0 6px}
  .field{display:grid;grid-template-columns:220px 1fr;gap:8px 14px;align-items:start;padding:7px 0;border-bottom:1px solid rgba(46,33,72,.5)}
  .field:last-child{border-bottom:0}
  .field label{font-weight:600;color:var(--ink);font-size:12.5px;padding-top:6px}
  .field label small{display:block;font-weight:400;color:var(--ink-faint);font-family:"JetBrains Mono",monospace;font-size:10.5px}
  .field input[type=text],.field input[type=number],.field select{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--card-line);border-radius:6px;padding:7px 9px;font:12.5px "JetBrains Mono",monospace}
  .field input.bad{border-color:var(--bad)}
  .field .help{grid-column:2;font-size:11.5px;color:var(--ink-soft);margin-top:-2px}
  .field .rec{color:var(--amber)}
  .bar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;display:flex;gap:10px;align-items:center;border-top:1px solid var(--card-line)}
  .msg{font-size:12px;color:var(--ink-soft)}
  .msg.bad{color:var(--bad)} .msg.good{color:var(--good)}
  fieldset.bad{border-color:var(--bad)}
  fieldset > .help{font-size:11.5px;color:var(--ink-soft);margin:4px 0 8px}
  fieldset .rec{color:var(--amber)}
  table.stocks{width:100%;border-collapse:collapse;margin:6px 0}
  table.stocks th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;text-align:left;padding:4px}
  table.stocks td{padding:3px 4px}
  table.stocks input{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--card-line);border-radius:6px;padding:6px 7px;font:12px "JetBrains Mono",monospace}
  table.stocks input.mint{min-width:220px}
  .stockadd{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .stockadd .btn,table.stocks .btn{text-transform:none;letter-spacing:.02em}
</style>
</head>
<body>
<h1>COINMARKET<em>CAT</em> options</h1>
<p class="lead">Every dial the lane reads. The defaults are the executor's own, except the three the record moved — marked in brass. Blank means "the policy's own default".</p>
<form id="form"></form>
<div class="bar">
  <button id="btnSave" class="btn">Save</button>
  <button id="btnDefaults" class="btn ghost" type="button">Reset to defaults</button>
  <span id="msg" class="msg"></span>
</div>
<script type="module" src="options.js"></script>
</body>
</html>
