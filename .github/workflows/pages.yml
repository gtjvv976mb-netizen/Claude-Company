# Builds the static site (three.js inlined, routes rewritten to relative links) and
# publishes dist/ to GitHub Pages on every push to main.
#
# One-time setup after creating the repo: Settings → Pages → Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            executor/package-lock.json
      - name: Install site and isolated executor dependencies
        run: |
          npm ci
          npm ci --prefix executor --ignore-scripts
      - name: Run isolated regression suite
        run: npm test
      - name: Build static site
        # SITE_URL (the custom domain) makes og:image absolute for link-preview crawlers.
        # API_BASE points the static site at the Render service; Pages cannot run the
        # scanner or the database itself.
        # RH_API_BASE is the ROBINHOOD desk's own service — a different host — so the
        # gateway's two-chains panel can read it. Empty means "do not ask", which is why
        # it stayed unset until that service existed; it answers /api/lease/config now.
        run: SITE_URL="https://claudedotcompany.com" API_BASE="${{ vars.API_BASE }}" RH_API_BASE="${{ vars.RH_API_BASE || 'https://claude-company-robinhood-api.onrender.com' }}" EXECUTOR_COMMIT="${{ github.sha }}" npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
