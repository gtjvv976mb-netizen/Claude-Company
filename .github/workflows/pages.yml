# Builds the static site (three.js inlined, routes rewritten to relative links) and
# publishes dist/ to GitHub Pages on every push to main.
#
# One-time setup after creating the repo: Settings → Pages → Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        # SITE_URL (the custom domain) makes og:image absolute for link-preview crawlers.
        # API_BASE points the static site at the Render service; Pages cannot run the
        # scanner or the database itself.
        run: API_BASE="${{ vars.API_BASE }}" node scripts/build-viewer.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
